<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="Section 1 tutorial 1: Attach images to an issue">
  <style>
    .s{font-family:"Mona Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Monaspace Neon",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e3e5e0"/></pattern>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1f2328" flood-opacity=".08"/></filter>
    <clipPath id="c1"><rect x="600" y="44" width="620" height="156" rx="12"/></clipPath>
    <clipPath id="c2"><rect x="560" y="226" width="620" height="218" rx="12"/></clipPath>
  </defs>
  <rect width="1280" height="480" fill="#f3f4f1"/>
  <rect width="1280" height="480" fill="url(#grid)"/>

  <text x="56" y="120" class="m" font-size="15" letter-spacing="3" fill="#59636e">SECTION 1 · TUTORIAL 1</text>
  <text x="56" y="198" class="s" font-size="60" font-weight="600" letter-spacing="-1.5" fill="#0d0d0d">Attach images</text>
  <text x="56" y="266" class="s" font-size="60" font-weight="600" letter-spacing="-1.5" fill="#0d0d0d">to an issue</text>
  <rect x="56" y="298" width="64" height="4" fill="#1f883d"/>
  <text x="56" y="350" class="s" font-size="24" fill="#59636e">Screenshots, straight from</text>
  <text x="56" y="384" class="s" font-size="24" fill="#59636e">the terminal.</text>

  <!-- terminal card -->
  <g filter="url(#sh)"><rect x="600" y="44" width="620" height="156" rx="12" fill="#0d1117"/></g>
  <g clip-path="url(#c1)"><rect x="600" y="44" width="7" height="156" fill="#1f883d"/></g>
  <circle cx="632" cy="68" r="5" fill="#ff7b72"/><circle cx="650" cy="68" r="5" fill="#d29922"/><circle cx="668" cy="68" r="5" fill="#3fb950"/>
  <text x="632" y="106" class="m" font-size="16" fill="#e6edf3"><tspan fill="#3fb950">$</tspan> gh issue create \</text>
  <text x="668" y="130" class="m" font-size="16" fill="#e6edf3">--title <tspan fill="#a5d6ff">"Menu prices show $NaN"</tspan> \</text>
  <text x="668" y="154" class="m" font-size="16" fill="#e6edf3"><tspan fill="#ffa657">--attach</tspan> <tspan fill="#a5d6ff">'menu-prices.png#Menu board…'</tspan></text>
  <text x="632" y="182" class="m" font-size="14" fill="#8b949e">https://github.com/you/virtual-universe-26/issues/7</text>

  <!-- issue card -->
  <g filter="url(#sh)"><rect x="560" y="226" width="620" height="218" rx="12" fill="#fff"/></g>
  <g clip-path="url(#c2)"><rect x="560" y="226" width="7" height="218" fill="#1f883d"/></g>
  <text x="592" y="266" class="s" font-size="22" fill="#1f2328">Menu prices show $NaN <tspan fill="#59636e">#7</tspan></text>
  <rect x="592" y="282" width="70" height="26" rx="13" fill="#1f883d"/>
  <circle cx="608" cy="295" r="5.5" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="608" cy="295" r="1.6" fill="#fff"/>
  <text x="619" y="300" class="s" font-size="13" font-weight="600" fill="#fff">Open</text>
  <line x1="560" y1="324" x2="1180" y2="324" stroke="#d1d9e0"/>
  <text x="592" y="352" class="s" font-size="15" fill="#1f2328">Playwright caught this:</text>
  <!-- screenshot thumbnail -->
  <rect x="592" y="366" width="300" height="62" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <rect x="604" y="376" width="276" height="16" rx="3" fill="#ffebe9" stroke="#ff8182"/>
  <text x="612" y="388" class="s" font-size="10" fill="#82071e">We couldn’t load prices for this menu</text>
  <text x="606" y="414" class="s" font-size="12" fill="#1f2328">Espresso</text><text x="868" y="414" class="m" font-size="12" text-anchor="end" fill="#cf222e">$NaN</text>
  <text x="910" y="384" class="s" font-size="13" fill="#59636e">menu-prices.png</text>
  <text x="910" y="404" class="s" font-size="13" fill="#59636e">Menu board showing $NaN</text>
</svg>
