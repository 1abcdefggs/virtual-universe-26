<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="Section 1: The Modern GitHub Experience">
  <style>
    .s{font-family:"Mona Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Monaspace Neon",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e3e5e0"/></pattern>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1f2328" flood-opacity=".08"/></filter>
    <clipPath id="c1"><rect x="640" y="44" width="580" height="156" rx="12"/></clipPath>
    <clipPath id="c2"><rect x="600" y="226" width="580" height="218" rx="12"/></clipPath>
  </defs>
  <rect width="1280" height="480" fill="#f3f4f1"/>
  <rect width="1280" height="480" fill="url(#grid)"/>

  <text x="56" y="120" class="m" font-size="15" letter-spacing="3" fill="#59636e">SECTION 1 · 2 TUTORIALS</text>
  <text x="56" y="198" class="s" font-size="52" font-weight="600" letter-spacing="-1.3" fill="#0d0d0d">The Modern</text>
  <text x="56" y="260" class="s" font-size="52" font-weight="600" letter-spacing="-1.3" fill="#0d0d0d">GitHub Experience</text>
  <rect x="56" y="298" width="64" height="4" fill="#1f883d"/>
  <text x="56" y="350" class="s" font-size="24" fill="#59636e">Five-minute tutorials with</text>
  <text x="56" y="384" class="s" font-size="24" fill="#59636e">the GitHub CLI.</text>

  <!-- terminal card -->
  <g filter="url(#sh)"><rect x="640" y="44" width="580" height="156" rx="12" fill="#0d1117"/></g>
  <g clip-path="url(#c1)"><rect x="640" y="44" width="7" height="156" fill="#1f883d"/></g>
  <circle cx="672" cy="68" r="5" fill="#ff7b72"/><circle cx="690" cy="68" r="5" fill="#d29922"/><circle cx="708" cy="68" r="5" fill="#3fb950"/>
  <text x="672" y="106" class="m" font-size="16" fill="#e6edf3"><tspan fill="#3fb950">$</tspan> gh auth login <tspan fill="#ffa657">--web</tspan></text>
  <text x="672" y="132" class="m" font-size="14" fill="#8b949e">✓ Logged in as you</text>
  <text x="672" y="162" class="m" font-size="16" fill="#e6edf3"><tspan fill="#3fb950">$</tspan> gh repo fork <tspan fill="#ffa657">--remote</tspan></text>
  <text x="672" y="186" class="m" font-size="14" fill="#8b949e">✓ Created fork you/virtual-universe-26</text>

  <!-- tutorials card -->
  <g filter="url(#sh)"><rect x="600" y="226" width="580" height="218" rx="12" fill="#fff"/></g>
  <g clip-path="url(#c2)"><rect x="600" y="226" width="7" height="218" fill="#1f883d"/></g>
  <text x="632" y="264" class="s" font-size="13" font-weight="600" letter-spacing="1" fill="#59636e">TUTORIALS</text>
  <line x1="600" y1="280" x2="1180" y2="280" stroke="#d1d9e0"/>
  <circle cx="650" cy="318" r="16" fill="#ddf4ff"/><text x="650" y="324" class="s" font-size="15" font-weight="600" text-anchor="middle" fill="#0969da">1</text>
  <text x="682" y="314" class="s" font-size="18" font-weight="600" fill="#1f2328">Attach images to an issue</text>
  <text x="682" y="336" class="m" font-size="13" fill="#59636e">gh issue create --attach</text>
  <text x="1150" y="322" class="s" font-size="13" text-anchor="end" fill="#59636e">5 min</text>
  <line x1="632" y1="358" x2="1150" y2="358" stroke="#eff2f5"/>
  <circle cx="650" cy="398" r="16" fill="#ddf4ff"/><text x="650" y="404" class="s" font-size="15" font-weight="600" text-anchor="middle" fill="#0969da">2</text>
  <text x="682" y="394" class="s" font-size="18" font-weight="600" fill="#1f2328">Create a stacked PR</text>
  <text x="682" y="416" class="m" font-size="13" fill="#59636e">gh stack submit</text>
  <text x="1150" y="402" class="s" font-size="13" text-anchor="end" fill="#59636e">5 min</text>
</svg>
