<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="Section 3 final exercise: Attach a cheat sheet artifact">
  <style>
    .s{font-family:"Mona Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Monaspace Neon",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e3e5e0"/></pattern>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1f2328" flood-opacity=".08"/></filter>
    <clipPath id="c1"><rect x="600" y="44" width="620" height="252" rx="12"/></clipPath>
    <clipPath id="c2"><rect x="560" y="320" width="620" height="124" rx="12"/></clipPath>
  </defs>
  <rect width="1280" height="480" fill="#f3f4f1"/>
  <rect width="1280" height="480" fill="url(#grid)"/>

  <text x="56" y="120" class="m" font-size="15" letter-spacing="3" fill="#59636e">SECTION 3 · FINAL EXERCISE</text>
  <text x="56" y="198" class="s" font-size="60" font-weight="600" letter-spacing="-1.5" fill="#0d0d0d">Attach a cheat</text>
  <text x="56" y="266" class="s" font-size="60" font-weight="600" letter-spacing="-1.5" fill="#0d0d0d">sheet artifact</text>
  <rect x="56" y="298" width="64" height="4" fill="#1f883d"/>
  <text x="56" y="350" class="s" font-size="24" fill="#59636e">One skill. One issue. Two artifacts.</text>
  <text x="56" y="384" class="s" font-size="24" fill="#59636e">And a surprise.</text>

  <!-- issue card -->
  <g filter="url(#sh)"><rect x="600" y="44" width="620" height="252" rx="12" fill="#fff"/></g>
  <g clip-path="url(#c1)"><rect x="600" y="44" width="7" height="252" fill="#1f883d"/></g>
  <text x="632" y="86" class="s" font-size="22" fill="#1f2328">My GitHub Universe ’26 cheat sheet <tspan fill="#59636e">#10</tspan></text>
  <rect x="632" y="102" width="70" height="26" rx="13" fill="#1f883d"/>
  <circle cx="648" cy="115" r="5.5" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="648" cy="115" r="1.6" fill="#fff"/>
  <text x="659" y="120" class="s" font-size="13" font-weight="600" fill="#fff">Open</text>
  <line x1="600" y1="146" x2="1220" y2="146" stroke="#d1d9e0"/>
  <path d="M634 168l4 4 4-4" fill="none" stroke="#59636e" stroke-width="1.6"/>
  <text x="650" y="174" class="s" font-size="14" font-weight="600" fill="#1f2328">Artifacts</text>
  <rect x="718" y="161" width="20" height="18" rx="9" fill="#e7e9ec"/><text x="728" y="175" class="s" font-size="12" text-anchor="middle" fill="#1f2328">2</text>
  <text x="1194" y="176" class="s" font-size="20" text-anchor="middle" fill="#59636e">+</text>
  <!-- artifact rows -->
  <rect x="634" y="194" width="18" height="16" rx="2" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M637 207l4-5 3 3 2-2 4 4" fill="none" stroke="#59636e" stroke-width="1.4"/>
  <text x="664" y="206" class="s" font-size="15" font-weight="600" fill="#1f2328">GitHub Universe 2026 cheat sheet</text>
  <text x="664" y="227" class="s" font-size="13" fill="#59636e">The top updates from the Virtual Universe sessions</text>
  <rect x="634" y="246" width="18" height="16" rx="2" fill="none" stroke="#59636e" stroke-width="1.5"/><text x="643" y="259" class="s" font-size="12" font-weight="700" text-anchor="middle" fill="#59636e">?</text>
  <text x="664" y="258" class="s" font-size="15" font-weight="600" fill="#1f2328">Surprise card</text>
  <text x="664" y="279" class="s" font-size="13" fill="#59636e">Run the skill to find out ✨</text>

  <!-- prompt card -->
  <g filter="url(#sh)"><rect x="560" y="320" width="620" height="124" rx="12" fill="#fff"/></g>
  <g clip-path="url(#c2)"><rect x="560" y="320" width="7" height="124" fill="#1f883d"/></g>
  <rect x="586" y="340" width="572" height="86" rx="10" fill="#fff" stroke="#1f2328" stroke-width="1.3"/>
  <text x="604" y="372" class="s" font-size="16" fill="#1f2328">/universe-cheatsheet create an issue artifact with the cheat sheet</text>
  <rect x="1084" y="356" width="2" height="22" fill="#0969da"/>
  <text x="604" y="410" class="s" font-size="18" fill="#59636e">+</text>
  <text x="630" y="408" class="s" font-size="13" fill="#59636e">Interactive ⌄</text>
  <circle cx="1132" cy="402" r="14" fill="#1f2328"/><path d="M1132 409v-13m-5 5l5-5 5 5" fill="none" stroke="#fff" stroke-width="2"/>
</svg>
