<!doctype html>
<html><head><meta charset="utf-8"><title>GitHub Universe '26 cheat sheet</title>
<style>
:root{--g:#1f883d;--ink:#0d0d0d;--mute:#59636e;--line:#d1d9e0;--mono:"Monaspace Neon","Mona Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;width:1200px;background:#fff;color:var(--ink);font-family:"Mona Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:32px 40px 24px;border-bottom:2px solid var(--g)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
h1{margin:0;font-size:38px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
header img{height:96px}
.cols{display:grid;grid-template-columns:1fr 1fr}
section{padding:24px 40px 28px}
section+section{border-left:1px solid var(--line);background:#f3f4f1;background-image:linear-gradient(#e7e8e4 1px,transparent 1px),linear-gradient(90deg,#e7e8e4 1px,transparent 1px);background-size:24px 24px}
h2{margin:0 0 16px;font-size:24px;font-weight:500;letter-spacing:-.01em}
.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600}
.card h3::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:10px;vertical-align:middle}
.card p{margin:0 0 8px;color:var(--mute);font-size:14px;line-height:1.5}
code{font-family:var(--mono);font-size:12.5px;background:#f6f8fa;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
footer{display:flex;justify-content:space-between;padding:14px 40px;border-top:2px solid var(--g);font-family:var(--mono);font-size:12px;color:var(--mute)}
</style></head>
<body>
<header>
  <div><div class="eyebrow">GitHub Virtual Universe '26</div><h1>Cheat sheet</h1></div>
  <img src="{{MONA}}" alt="">
</header>
<div class="cols">
  <section>
    <h2>The Modern GitHub Experience</h2>
    <!-- One card per feature:
    <div class="card"><h3>Feature</h3><p>One-line summary.</p><code>command or /slash-command</code></div>
    -->
  </section>
  <section>
    <h2>Agentic Software Development with GitHub Copilot</h2>
    <!-- One card per feature, same format. -->
  </section>
</div>
<footer><span>github.com/features/ai/github-app</span><span>github.blog/changelog</span></footer>
</body></html>
