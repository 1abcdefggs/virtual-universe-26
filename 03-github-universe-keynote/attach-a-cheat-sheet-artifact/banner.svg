<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Section 3 final exercise: Attach a cheat sheet artifact">
  <style>
    .sans{font-family:"Mona Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:"Monaspace Neon",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7d6cf0" stroke-width="1"/></pattern>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#50fb86" opacity=".35"/></pattern>
  </defs>
  <rect width="1280" height="420" fill="#fff"/>
  <!-- left -->
  <text x="48" y="70" class="mono" font-size="16" letter-spacing="3" fill="#59636e">SECTION 3 · FINAL EXERCISE</text>
  <text x="48" y="150" class="sans" font-size="64" font-weight="600" letter-spacing="-1.5" fill="#0d0d0d">Attach a cheat</text>
  <text x="48" y="222" class="sans" font-size="64" font-weight="600" letter-spacing="-1.5" fill="#0d0d0d">sheet artifact</text>
  <line x1="0" y1="262" x2="760" y2="262" stroke="#1f883d" stroke-width="3"/>
  <text x="48" y="312" class="sans" font-size="26" fill="#6e7781">One skill. One issue. Two artifacts.</text>
  <text x="48" y="348" class="sans" font-size="26" fill="#6e7781">And a surprise.</text>
  <text x="48" y="398" class="mono" font-size="16" fill="#1f883d">/universe-cheatsheet</text>
  <!-- divider -->
  <line x1="760" y1="0" x2="760" y2="420" stroke="#1f883d" stroke-width="3"/>
  <!-- purple egg panel -->
  <rect x="761.5" y="0" width="300" height="420" fill="#6c5ce7"/>
  <rect x="761.5" y="0" width="300" height="420" fill="url(#grid)" opacity=".5"/>
  <g transform="translate(791 80)">  <defs>
    <radialGradient id="shell" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#f4f0ff"/>
      <stop offset=".35" stop-color="#b9a8ff"/>
      <stop offset=".7" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#3b2f9e"/>
    </radialGradient>
    <linearGradient id="band" x1="0" x2="1">
      <stop offset="0" stop-color="#50fb86"/>
      <stop offset=".5" stop-color="#b6ffcf"/>
      <stop offset="1" stop-color="#50fb86"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#50fb86" stop-opacity=".35"/>
      <stop offset="1" stop-color="#50fb86" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="egg"><path d="M120 30C70 30 40 110 40 165c0 50 36 85 80 85s80-35 80-85C200 110 170 30 120 30Z"/></clipPath>
    <path id="spark" d="M0-12C1.5-3 3-1.5 12 0 3 1.5 1.5 3 0 12-1.5 3-3 1.5-12 0-3-1.5-1.5-3 0-12Z"/>
  </defs>
  <ellipse cx="120" cy="150" rx="118" ry="128" fill="url(#aura)"/>
  <ellipse cx="120" cy="256" rx="62" ry="8" fill="#000" opacity=".45"/>
  <path d="M120 30C70 30 40 110 40 165c0 50 36 85 80 85s80-35 80-85C200 110 170 30 120 30Z" fill="url(#shell)"/>
  <g clip-path="url(#egg)">
    <path d="M30 160l18-16 18 16 18-16 18 16 18-16 18 16 18-16 18 16 18-16 18 16 18-16v18l-18 16-18-16-18 16-18-16-18 16-18-16-18 16-18-16-18 16-18-16-18 16Z" fill="url(#band)"/>
    <g fill="#eae3c0">
      <circle cx="88" cy="96" r="4"/><circle cx="150" cy="110" r="3"/><circle cx="118" cy="128" r="2.5"/>
      <circle cx="74" cy="212" r="3"/><circle cx="160" cy="214" r="4"/><circle cx="120" cy="232" r="2.5"/>
    </g>
    <use href="#spark" transform="translate(132 78) scale(.6)" fill="#fff"/>
    <use href="#spark" transform="translate(102 204) scale(.7)" fill="#b6ffcf"/>
    <ellipse cx="92" cy="88" rx="16" ry="30" transform="rotate(20 92 88)" fill="#fff" opacity=".45"/>
  </g>
  <use href="#spark" transform="translate(206 70) scale(1.3)" fill="#50fb86"/>
  <use href="#spark" transform="translate(30 104) scale(.9)" fill="#eae3c0"/>
  <use href="#spark" transform="translate(214 196) scale(.7)" fill="#b9a8ff"/>
  <use href="#spark" transform="translate(42 232) scale(.6)" fill="#50fb86"/>
  <circle cx="186" cy="32" r="3" fill="#eae3c0"/><circle cx="20" cy="170" r="2.5" fill="#50fb86"/></g>
  <!-- dark badger panel -->
  <rect x="1061.5" y="0" width="218.5" height="420" fill="#050506"/>
  <rect x="1061.5" y="0" width="218.5" height="420" fill="url(#dots)"/>
  <line x1="1061.5" y1="0" x2="1061.5" y2="420" stroke="#1f883d" stroke-width="3"/>
  <g class="mono" font-size="15" letter-spacing="2" fill="#50fb86" text-anchor="middle">
    <text x="1171" y="150">PRESS</text><text x="1171" y="176">THE GREY</text><text x="1171" y="202">BUTTONS</text>
  </g>
  <g fill="#9a9a9a" stroke="#50fb86" stroke-width="2.5">
    <rect x="1112" y="240" width="32" height="32" rx="7"/><rect x="1155" y="240" width="32" height="32" rx="7"/><rect x="1198" y="240" width="32" height="32" rx="7"/>
  </g>
  <text x="1171" y="330" class="mono" font-size="13" letter-spacing="1.5" fill="#98a49c" text-anchor="middle">NO SPOILERS.</text>
</svg>
